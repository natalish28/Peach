AWSTemplateFormatVersion: "2010-09-09"
Description: Amazon Cognito User Pool and App Client for Peach

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for resource names and tags.

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000,http://localhost:3000/auth/callback"
    Description: Allowed callback URLs for OAuth.

  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
    Description: Allowed logout URLs.

  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth Client ID.
    NoEcho: true

  GoogleClientSecret:
    Type: String
    Default: ""
    Description: Google OAuth Client Secret.
    NoEcho: true

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email profile openid"
      AttributeMapping:
        email: email
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub "${ProjectName}-web-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      SupportedIdentityProviders:
        !If
          - HasGoogle
          - - COGNITO
            - Google
          - - COGNITO

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-auth-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  ClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient

  Domain:
    Description: Cognito Hosted UI Domain
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
