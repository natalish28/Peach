AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Peach Lab 6: the agenda-parser Lambda (Claude on Amazon Bedrock) behind its own
  function URL, and a monthly AWS Budget alarm. No VPC: the parser needs no database.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for resource names and the PROJECT_NAME tag.

  ImageUri:
    Type: String
    Description: ECR image URI (the backend container image; only the handler differs).

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: >-
      Bedrock model ID. anthropic.claude-* uses the Messages API (needs a paid account plan);
      anything else, e.g. us.amazon.nova-lite-v1:0, uses the Converse API.

  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: Origins the browser may call the parser from (the site URL once it has one).

  LogRetentionDays:
    Type: Number
    Default: 30

  BudgetEmail:
    Type: String
    Description: Where the monthly budget alarm is sent.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5

Resources:
  ExecutionRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference # Claude, Anthropic Messages API
                  - bedrock:InvokeModel # Converse API (Amazon Nova, ...)
                Resource: "*" # TODO narrow to the model's ARN (class discussion question)
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: !Sub "${ProjectName} agenda parser (pasted text -> JSON via Bedrock)"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          APP_ENV: production
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref AWS::Region
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          # Left empty on purpose: outside the VPC the keys are fetched from the issuer.
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionUrl:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE # the handler verifies the Cognito token itself
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600

  FunctionUrlPermission:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  MonthlyBudget:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ParserUrl:
    Description: Function URL of the agenda parser, with no trailing slash.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]

  FunctionName:
    Value: !Ref Function
