AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Peach backend on AWS Lambda: the FastAPI app in a container image, served over
  HTTPS by a Lambda function URL, with Postgres on Aurora Serverless v2 that
  pauses to zero ACUs when idle. Deployed by scripts/deploy-backend.sh.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for every resource name, and the project tag.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that holds the function's network interfaces and the database.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets, in different AZs, for the function and the database.

  ImageUri:
    Type: String
    Description: Fully qualified image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/peach-backend:abc1234

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  TimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900

  DbName:
    Type: String
    Default: peach

  DbUsername:
    Type: String
    Default: peach

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16

  DbEngineVersion:
    Type: String
    Default: "17.4"

  DbMinCapacity:
    Type: Number
    Default: 0
    MinValue: 0

  DbMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1

  DbSecondsUntilAutoPause:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400

  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35

  DatabaseEndpoint:
    Type: String
    Default: ""
    Description: >-
      Existing Aurora Serverless v2 endpoint. If specified, CloudFormation skips
      creating in-template RDS cluster.

  AppEnv:
    Type: String
    Default: production
    AllowedValues: [development, test, production]

  LogLevel:
    Type: String
    Default: info

  CorsOrigins:
    Type: String
    Default: "*"

  CognitoUserPoolId:
    Type: String
    Default: ""

  CognitoClientId:
    Type: String
    Default: ""

  CognitoJwks:
    Type: String
    Default: ""

  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  CreateDatabase: !Equals [!Ref DatabaseEndpoint, ""]

Resources:
  # --- networking ---
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateDatabase
    Properties:
      GroupDescription: !Sub "${ProjectName} backend function"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend-function"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateDatabase
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Postgres, from the function only
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- database ---
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: CreateDatabase
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbCluster:
    Type: AWS::RDS::DBCluster
    Condition: CreateDatabase
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-db"
      Engine: aurora-postgresql
      EngineVersion: !Ref DbEngineVersion
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DbMinCapacity
        MaxCapacity: !Ref DbMaxCapacity
        SecondsUntilAutoPause: !Ref DbSecondsUntilAutoPause
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbInstance:
    Type: AWS::RDS::DBInstance
    Condition: CreateDatabase
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db-1"
      DBClusterIdentifier: !Ref DbCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateDatabase
    Properties:
      Name: !Sub "${ProjectName}/backend/database-url"
      Description: !Sub "SQLAlchemy async connection string for ${ProjectName}"
      SecretString: !Sub
        - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
        - Endpoint: !GetAtt DbCluster.Endpoint.Address
          Port: !GetAtt DbCluster.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function ---
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: RdsDbConnect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds-db:connect
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      Description: !Sub "${ProjectName} FastAPI backend"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          APP_ENV: !Ref AppEnv
          LOG_LEVEL: !Ref LogLevel
          CORS_ORIGINS: !Ref CorsOrigins
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
          DB_POOLING: "false"
          DATABASE_URL: !If
            - CreateDatabase
            - !Sub
              - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
              - Endpoint: !GetAtt DbCluster.Endpoint.Address
                Port: !GetAtt DbCluster.Endpoint.Port
            - !Sub "postgresql+asyncpg://${DbUsername}:${DbPassword}@${DatabaseEndpoint}:5432/${DbName}?ssl=require"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Base URL of the backend, with no trailing slash.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]

  FunctionName:
    Value: !Ref Function

  DatabaseEndpoint:
    Value: !If
      - CreateDatabase
      - !GetAtt DbCluster.Endpoint.Address
      - !Ref DatabaseEndpoint

  LogGroupName:
    Value: !Ref LogGroup
